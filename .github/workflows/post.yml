name: Instagram paylaşımı

# GitHub'ın zamanlayıcısı bazen saatlerce gecikiyor ya da bazı çalışmaları atlıyor.
# Bu yüzden iş her 10 dakikada bir uyanır ve sadece "şu an zamanı gelmiş ya da kaçmış
# paylaşım var mı?" diye bakar (netio/due.py). Yoksa birkaç saniyede kapanır.
# Varsa medyayı üretir, GitHub Pages'e yükler ve paylaşım saatini bekleyip gönderir.
# Kaçan bir paylaşım 5 saate kadar geç de olsa gönderilir; aynı slot iki kez paylaşılmaz.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot: auto (zamanı gelenler) ya da story1 noon story2 afternoon story3 story4 tt1 tt2 (boşlukla birden fazla)"
        type: string
        default: auto
      dry_run:
        description: "Sadece dene (Instagram'a gönderme)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: netio-post-v2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.due.outputs.slot }}
    steps:
      - uses: actions/checkout@v5
      - name: Zamanı gelen paylaşım var mı?
        id: due
        run: |
          S="${{ inputs.slot }}"
          if [ -z "$S" ] || [ "$S" = "auto" ]; then S=$(python3 -m netio.due); fi   # may be several, space separated
          echo "slot=$S" >> "$GITHUB_OUTPUT"
          if [ -n "$S" ]; then echo "Paylaşılacak: $S"; else echo "Şu an paylaşılacak bir şey yok."; fi

  post:
    needs: check
    if: needs.check.outputs.slot != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SLOT: ${{ needs.check.outputs.slot }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Medyayı üret
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        run: python -m netio.main prepare --slot "$SLOT"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: GitHub Pages'e yükle
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Instagram'a paylaş
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_NEW_REFRESH_FILE: ${{ runner.temp }}/tt_refresh.txt
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run --no-wait"; fi
          python -m netio.main publish --slot "$SLOT" $DRY

      - name: TikTok anahtarını güncelle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          F: ${{ runner.temp }}/tt_refresh.txt
        run: |
          if [ -s "$F" ]; then gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$F" && echo "TikTok refresh token güncellendi."; fi

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "netio-bot"
          git config user.email "netio-bot@users.noreply.github.com"
          git add state/state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "state: ${SLOT// /,} $(date -u +%F)"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
