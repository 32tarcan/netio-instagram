name: Günü önizle (paylaşmadan)

# Seçilen günün tüm gönderilerini üretir ve indirilebilir dosya olarak ekler.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Tarih (YYYY-AA-GG), boş = bugün"
        required: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -r requirements.txt
      - run: |
          if [ -n "${{ inputs.date }}" ]; then python -m netio.main preview --date "${{ inputs.date }}"; else python -m netio.main preview; fi
      - uses: actions/upload-artifact@v6
        with:
          name: netio-onizleme
          path: out/preview
