name: Bağlantıyı kontrol et

# Token'ın çalıştığını doğrular; hesap adını, IG_USER_ID'yi ve paylaşım kotasını yazdırır.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python -m netio.main whoami
          python -m netio.main status
          python -m netio.main stories
