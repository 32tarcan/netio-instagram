name: Paneli güncelle

# Sadece "Senin sıran" panelini (…/panel/) yeniden üretip GitHub Pages'e yükler, paylaşım yapmaz.
# Paylaşım işiyle aynı sırayı kullanır, böylece paylaşım sürerken medya dosyalarını silmez.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: netio-post
  cancel-in-progress: false

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          echo "::notice title=tiktok::client key başı: ${TIKTOK_CLIENT_KEY:0:6}"
          python -m netio.main panel
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
